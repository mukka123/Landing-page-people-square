spring:
  application:
    name: political-ops-platform

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/political_ops}
    username: ${DB_USER:political_ops}
    password: ${DB_PASSWORD:changeme}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, never by Hibernate auto-DDL
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect
        jdbc:
          time_zone: UTC
        default_schema: public
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:https://idp.example.internal/realms/political-ops}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never   # never leak internal error detail; use Problem Details with a request id instead

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /api/v1/docs

app:
  # AI orchestration service is deployed independently (see HLD section 4) — this app only
  # calls it over HTTP/events, it never embeds model calls directly.
  ai-orchestrator:
    base-url: ${AI_ORCHESTRATOR_URL:http://ai-orchestrator:9000}
  pagination:
    default-page-size: 50
    max-page-size: 200
  export:
    signed-url-ttl-minutes: 30
  retention:
    default-audit-years: 7

logging:
  level:
    com.politicalops: INFO
    org.hibernate.SQL: WARN
